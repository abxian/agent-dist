; ================================================
; Remote Camera Agent - configuration file
; Changes take effect on next reconnect (no restart needed)
; ================================================

[Server]
; Server IP or hostname
Host=sx1.jc116.com
; Server port (must match Server.exe setting)
Port=9999
; Connection password (must match Server.exe, leave empty for none)
Password=
; tcp = legacy port; tls = encrypted port with SHA-256 pin below
Protocol=tcp
CertificateFingerprint=
; Reconnect interval in seconds (min 3)
ReconnectSeconds=10

[QUIC]
; Preferred low-latency media path. Commands and authentication stay on TCP/TLS.
Enabled=1

[Bootstrap]
; Delivery website. The agent checks <ConfigUrl>/bootstrap.ini periodically.
ConfigUrl=https://cam.sxnn.de:5443
CheckSeconds=60

[Identity]
DeviceToken=

[Camera]
; Camera device index (0 = first/default camera)
Index=0
; JPEG quality 1-100  (100=best, still JPEG-compressed)
Quality=100
; Frames per second 1-60
Fps=30
; Capture resolution
Width=1920
Height=1080
